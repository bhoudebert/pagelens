<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pagelens social preview</title>
<style>
  :root { --y:#ffc400; --bg:#0e1114; --p:#eef1f4; --m:#7d8a97; --b:#5ab0ff; --ok:#3ddc84; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg); }
  body {
    position: relative; font-family: system-ui, sans-serif; color: var(--p);
    background-image: linear-gradient(rgba(90,176,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(90,176,255,.06) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .hz { position: absolute; left: 0; right: 0; height: 22px; background: repeating-linear-gradient(-45deg, var(--y) 0 22px, var(--bg) 22px 44px); }
  .top { top: 0; } .bot { bottom: 0; }
  .tag { position: absolute; left: 72px; top: 78px; font: 700 20px ui-monospace, Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; background: var(--y); color: var(--bg); padding: 6px 14px; }
  h1 { position: absolute; left: 68px; top: 140px; font: 900 118px/1 Impact, "Arial Black", "DejaVu Sans", sans-serif; letter-spacing: -.01em; text-transform: uppercase; }
  h1 span { color: var(--y); }
  .sub { position: absolute; left: 72px; top: 300px; width: 640px; font: 600 38px/1.25 system-ui, sans-serif; color: var(--p); }
  .sub em { font-style: normal; color: var(--y); }
  .chips { position: absolute; left: 72px; top: 452px; display: flex; gap: 14px; }
  .chip { font: 700 18px ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; border: 2px solid var(--m); color: var(--m); padding: 8px 14px; }
  .chip.on { border-color: var(--ok); color: var(--ok); }
  .belt { position: absolute; left: 72px; top: 540px; width: 650px; height: 10px; background: repeating-linear-gradient(90deg, #2a333c 0 18px, #1d242b 18px 36px); border-top: 2px solid var(--m); border-bottom: 2px solid var(--m); }

  /* page mock */
  .page { position: absolute; right: 80px; top: 92px; width: 340px; height: 450px; background: #f4f1ea; transform: rotate(3deg); box-shadow: 14px 14px 0 rgba(0,0,0,.55); border: 3px solid #2a333c; }
  .page .l { position: absolute; left: 28px; height: 10px; background: #c9c4b8; }
  .page .h { position: absolute; left: 28px; top: 28px; width: 150px; height: 16px; background: #3b4552; }
  .page .pump { position: absolute; left: 70px; top: 120px; width: 200px; height: 150px; }
  .box { position: absolute; left: 52px; top: 100px; width: 240px; height: 190px; border: 5px solid var(--y); }
  .box::before { content: "p. 2 · 0.79"; position: absolute; left: -5px; top: -34px; background: var(--y); color: var(--bg); font: 700 17px ui-monospace, Menlo, monospace; padding: 4px 10px; }
  .badge { position: absolute; left: 52px; top: 308px; background: var(--ok); color: var(--bg); font: 800 18px ui-monospace, Menlo, monospace; letter-spacing: .1em; padding: 6px 12px; }
</style></head>
<body>
  <div class="hz top"></div>
  <div class="tag">Local · Multimodal · Grounded</div>
  <h1>Page<span>lens</span></h1>
  <div class="sub">Find which page of which PDF <em>shows it.</em></div>
  <div class="chips"><span class="chip">Text</span><span class="chip">Photo</span><span class="chip on">Verified</span><span class="chip">On-prem</span></div>
  <div class="belt"></div>

  <div class="page">
    <div class="h"></div>
    <div class="l" style="top:62px;width:260px"></div><div class="l" style="top:80px;width:220px"></div>
    <svg class="pump" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="95" width="180" height="22" fill="#3b4552"/>
      <rect x="20" y="40" width="70" height="55" rx="6" fill="#2d5fa8"/>
      <circle cx="132" cy="68" r="42" fill="#3b78d0"/><circle cx="132" cy="68" r="16" fill="#1f3f73"/>
      <rect x="86" y="14" width="36" height="22" fill="#2d5fa8"/>
    </svg>
    <div class="box"></div><div class="badge">CONFIRMED</div>
    <div class="l" style="top:352px;width:250px"></div><div class="l" style="top:370px;width:200px"></div><div class="l" style="top:388px;width:240px"></div>
  </div>
  <div class="hz bot"></div>
</body></html>
