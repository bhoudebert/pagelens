name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: every commit of a pull request is checked below.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev --python ${{ matrix.python }}
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov=pagelens --cov-report=term-missing
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request' && matrix.python == '3.12'
        run: uvx --from commitizen cz check --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check path:.
